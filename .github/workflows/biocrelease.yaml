on:
  schedule:
    - cron: "42 02 3 * *"

name: syncronise-bioconductor-release

permissions:
  contents: write
  pull-requests: write

jobs:
  send-pull-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BIOC_REMOTE='https://git.bioconductor.org/packages/midasHLA'
          # Bioconductor renamed its default branch from master to devel
          BIOC_BRANCH='devel'
          MAIN_BRANCH='master'
          git remote add bioconductor "${BIOC_REMOTE}"
          git fetch bioconductor "${BIOC_BRANCH}:bioconductor_update"
          if ! git merge-base --is-ancestor bioconductor_update "origin/${MAIN_BRANCH}"; then
            git push --force origin bioconductor_update
            gh pr create --base "${MAIN_BRANCH}" --head bioconductor_update --fill \
              || echo "Pull request from bioconductor_update is already open"
          fi
